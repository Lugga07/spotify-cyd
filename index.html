   <!doctype html>
   <html><head><meta charset="utf-8">
   <meta name="viewport" content="width=device-width,initial-scale=1">
   <title>Spotify display login</title></head>
   <body style="font-family:sans-serif;text-align:center;padding:2em">
   <h2 id="msg">Connecting to your display…</h2>
   <script>
   const p = new URLSearchParams(location.search);
   const state = p.get("state") || "";
   const m = state.match(/^(\d{1,3}(?:\.\d{1,3}){3})_([0-9a-f]{1,8})$/i);
   function isPrivate(ip) {
     const a = ip.split(".").map(Number);
     if (a.length !== 4 || a.some(n => n > 255)) return false;
     return a[0] === 10 || (a[0] === 192 && a[1] === 168) ||
            (a[0] === 172 && a[1] >= 16 && a[1] <= 31);
   }
   if (!m || !isPrivate(m[1])) {
     document.getElementById("msg").textContent =
       "Invalid request. Please scan the QR code on your display again.";
   } else {
     const q = new URLSearchParams();
     for (const k of ["code", "error", "state"]) if (p.get(k)) q.set(k, p.get(k));
     location.replace("http://" + m[1] + "/callback?" + q.toString());
   }
   </script>
   </body></html>
